<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Suspended</title><style>:root{--text:#1d1d1f;--muted:#6e6e73;--bg:#f5f5f7;--card:#fff;--line:#e5e5e7;--blue:#0071e3}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text)}body{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 38px rgba(0,0,0,.06);padding:42px 34px;text-align:center}.icon{width:64px;height:64px;margin:0 auto 22px;border-radius:18px;background:#f1f7ff;color:var(--blue);display:grid;place-items:center;font-size:30px;font-weight:800}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}h1{margin:0 0 10px;font-size:30px;line-height:1.1;letter-spacing:-.04em}p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}</style></head><body><main class="card" role="status" aria-live="polite"><div class="icon">!</div><div class="eyebrow">Account status</div><h1>Your account is suspended.</h1><p>Please contact your administrator to restore access.</p></main></body></html>
