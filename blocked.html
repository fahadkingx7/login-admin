<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cookie Sync • Profile Locked</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--danger:#b42318;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#fff1f2,#f8fafc 55%,#f5f7fb);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:grid;place-items:center;padding:26px}.box{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 24px 70px rgba(15,23,42,.12);text-align:center}.icon{width:68px;height:68px;border-radius:20px;background:#fee2e2;color:var(--danger);display:grid;place-items:center;margin:0 auto 16px;font-size:31px;font-weight:900}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--danger)}h1{font-size:25px;margin:7px 0 8px;color:#991b1b}p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.reason{margin-top:15px;padding:12px 14px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;font-size:12px;color:#344054}.btn{margin-top:18px;border:0;border-radius:12px;background:#4f46e5;color:#fff;padding:11px 18px;font-weight:800;cursor:pointer}.small{margin-top:13px;font-size:10px;color:#98a2b3}</style><style id="veefivee-footer-visibility">.veefivee-footer{position:fixed!important;left:0!important;right:0!important;bottom:0!important;margin:0!important;padding:12px 20px 14px!important;z-index:99999!important;background:rgba(245,247,251,.97)!important;border-top:1px solid #e5e7ef!important;box-shadow:0 -6px 18px rgba(15,23,42,.05)!important;}</style></head><body><main class="box"><div class="icon">!</div><div class="eyebrow">Cookie Sync Security</div><h1>PROFILE LOCKED</h1><p>This browser profile is temporarily locked and managed web access is disabled.</p><div id="reason" class="reason">An unauthorized extension or security condition was detected.</div><button id="check" class="btn">Check Again</button><div class="small">Remove the conflicting extension or fix the security condition, then check again.</div></main><script>const q=new URLSearchParams(location.search);document.getElementById('reason').textContent=q.get('reason')||'An unauthorized extension or security condition was detected.';document.getElementById('check').onclick=()=>chrome.runtime.sendMessage({type:'warning-check'}).then(r=>{if(r?.ok)location.href='about:blank';else document.getElementById('reason').textContent=r?.error||'The profile is still locked.'}).catch(()=>{document.getElementById('reason').textContent='Unable to contact the extension. Please reopen the extension.'});</script><footer class="veefivee-footer" style="box-sizing:border-box;width:100%;margin:40px auto 0;padding:16px 20px 18px;text-align:center;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;font-weight:500;line-height:1.5;color:#6d4aff;letter-spacing:.1px;">Developed by 🌴<a href="https://veefivee.com" target="_blank" rel="noopener noreferrer" style="color:#6d4aff;text-decoration:none;font-weight:700;">VeeFivee</a></footer>
</body></html>
